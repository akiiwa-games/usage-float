[pytest]
# Capture at the sys level, not by swapping file descriptors 0-2 between tests. Tcl caches the standard
# channel handles when the first Tk interpreter is created; after pytest swaps and closes those descriptors,
# a later Tk interpreter in the same process can hit a stale handle while sourcing its library and fail with
# "couldn't read file .../tk8.6/<name>.tcl" (about one run in ten for the run_ui tests).
addopts = --capture=sys
